<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPXS Collection | Linktree</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        a:focus {
            outline: none;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            background: linear-gradient(-45deg, #0F2027, #203A43, #2C5364, #203A43);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            min-height: 100dvh;
            color: white;
            font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 3rem 1rem 2rem 1rem;
            animation: fadeInUp 0.8s ease-out forwards;
        }

        @media (min-width: 640px) {
            .container {
                padding-left: 1.5rem;
                padding-right: 1.5rem;
            }
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: 2rem;
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-title {
            font-size: 1.875rem; /* 30px */
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        @media (min-width: 640px) {
            .profile-title {
                font-size: 2.25rem; /* 36px */
            }
        }

        .profile-subtitle {
            color: #9ca3af;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
            font-weight: 300;
            max-width: 320px;
            line-height: 1.625;
        }

        @media (min-width: 640px) {
            .profile-subtitle {
                font-size: 1rem;
            }
        }

        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 1rem 1.5rem;
            border: 1px solid white;
            border-radius: 9999px;
            text-align: center;
            font-weight: 500;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            font-size: 0.875rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        @media (min-width: 640px) {
            .link-card {
                font-size: 1rem;
            }
        }

        .link-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: skewX(-25deg);
            transition: 0.7s;
        }

        .link-card:hover::after {
            left: 150%;
        }

        .link-card:hover {
            transform: scale(1.05);
            background-color: white;
            color: black;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 40px rgba(255, 255, 255, 0.2);
        }

        .link-card i {
            font-size: 1.25rem;
            margin-right: 0.75rem;
        }

        .socials-wrapper {
            display: flex;
            gap: 2rem;
            font-size: 1.5rem;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        @media (min-width: 640px) {
            .socials-wrapper {
                font-size: 1.875rem;
            }
        }

        .social-link {
            display: inline-block;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            transform: scale(1.25);
        }

        .social-link.facebook:hover {
            color: #3b82f6;
        }

        .social-link.instagram:hover {
            color: #ec4899;
        }

        .social-link.youtube:hover {
            color: #ef4444;
        }

        .footer {
            margin-top: auto;
            padding-top: 2rem;
            color: #6b7280;
            font-size: 0.75rem;
            text-align: center;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Main Content -->
        <div class="content-wrapper">
            <!-- Profile Section -->
            <div class="profile-section">
                <h1 class="profile-title">NPXS Collection</h1>
                <p class="profile-subtitle">
                    GRAPHIC DESIGN • PHOTOGRAPHY • MOTION DESIGN • SOUND ENGINEER ❤🔥 THAILAND 🇹🇭
                </p>
            </div>

            <!-- Links Section -->
            <div class="links-wrapper">
                <a href="https://www.facebook.com/NPXS0123zz/" target="_blank" class="link-card">
                    <i class="fab fa-facebook"></i> Facebook
                </a>
                <a href="https://www.instagram.com/ntp_rmx/" target="_blank" class="link-card">
                    <i class="fab fa-instagram"></i> Instagram
                </a>
                <a href="https://www.youtube.com/@NATTAPHONREMIX" target="_blank" class="link-card">
                    <i class="fab fa-youtube"></i> YouTube Channel
                </a>
                <a href="https://ntpremix.x2finity.xyz/" target="_blank" class="link-card">
                    <i class="fas fa-camera"></i> PHOTO
                </a>
            </div>

            <!-- Social Icons Footer -->
            <div class="socials-wrapper">
                <a href="https://www.facebook.com/NPXS0123zz/" target="_blank" class="social-link facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="https://www.instagram.com/ntp_rmx/" target="_blank" class="social-link instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.youtube.com/@NATTAPHONREMIX" target="_blank" class="social-link youtube">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
        </div>

        <footer class="footer">
            &copy; 2026 NPXS Collection.
        </footer>
    </div>
</body>

</html>
