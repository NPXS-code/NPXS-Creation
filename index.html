<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPXS Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        a:focus {
            outline: none;
        }

        @keyframes gradientMove {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body {
            background: linear-gradient(-45deg, #0F2027, #203A43, #2C5364, #203A43);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
            min-height: 100dvh;
            color: white;
            font-family: 'Prompt', 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji';
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 680px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(2rem, 6vh, 4rem) clamp(1rem, 4vw, 2rem) clamp(1.5rem, 4vh, 3rem) clamp(1rem, 4vw, 2rem);
            animation: fadeInUp 0.8s ease-out forwards;
        }

        .content-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            gap: clamp(1.5rem, 4vh, 2.5rem);
        }

        .profile-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .profile-title {
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        .profile-subtitle {
            color: #9ca3af;
            font-size: clamp(0.85rem, 2.2vw, 1rem);
            margin-bottom: 0.5rem;
            font-weight: 300;
            max-width: clamp(280px, 80vw, 450px);
            line-height: 1.625;
        }

        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: clamp(0.75rem, 2vw, 1.25rem);
        }

        .link-card {
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: clamp(0.875rem, 2.2vw, 1.25rem) clamp(1rem, 3vw, 2rem);
            border: 1px solid white;
            border-radius: 9999px;
            text-align: center;
            font-weight: 500;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            font-size: clamp(0.875rem, 2vw, 1.1rem);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        .link-card::after {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, transparent, rgba(255, 255, 255, 0.4), transparent);
            transform: skewX(-25deg);
            transition: 0.7s;
        }

        .link-card:hover::after {
            left: 150%;
        }

        .link-card:hover {
            transform: scale(1.05);
            background-color: white;
            color: black;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5), 0 0 40px rgba(255, 255, 255, 0.2);
        }

        .link-card i {
            font-size: clamp(1.1rem, 2.2vw, 1.4rem);
            margin-right: 0.75rem;
        }

        .socials-wrapper {
            display: flex;
            gap: clamp(1.5rem, 4vw, 2.5rem);
            font-size: clamp(1.5rem, 4vw, 2rem);
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .social-link {
            display: inline-block;
            transition: all 0.3s ease;
        }

        .social-link:hover {
            transform: scale(1.25);
        }

        .social-link.facebook:hover {
            color: #3b82f6;
        }

        .social-link.instagram:hover {
            color: #ec4899;
        }

        .social-link.youtube:hover {
            color: #ef4444;
        }

        /* Category Section */
        .category-section {
            width: 100%;
        }

        .category-label {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: clamp(0.75rem, 2vw, 1rem);
            padding-left: 0.25rem;
        }

        .category-label i {
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            opacity: 0.7;
        }

        .category-label span {
            font-size: clamp(0.8rem, 2vw, 0.95rem);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #9ca3af;
        }

        .category-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.2), transparent);
        }

        .category-divider {
            width: 100%;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            margin: clamp(0.75rem, 2vw, 1.5rem) 0;
        }

        .footer {
            margin-top: auto;
            padding-top: 2rem;
            color: #6b7280;
            font-size: 0.75rem;
            text-align: center;
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Main Content -->
        <div class="content-wrapper">
            <!-- Profile Section -->
            <div class="profile-section">
                <h1 class="profile-title">NPXS Collection</h1>
                <p class="profile-subtitle">
                    PHOTOGRAPHY • VIDEOGRAPHY • GRAPHIC DESIGN • MOTION DESIGN • SOUND ENGINEER • REMIXER
                    <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/2764-fe0f-200d-1f525.svg" alt="❤️‍🔥" style="height:1.1em;vertical-align:-0.15em;">
                    THAILAND
                    <img src="https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f1f9-1f1ed.svg" alt="🇹🇭" style="height:1.1em;vertical-align:-0.15em;">
                </p>
            </div>

            <!-- ติดต่อ (Contact) Section -->
            <div class="category-section">
                <div class="category-label">
                    <i class="fas fa-address-book"></i>
                    <span>ติดต่อ · Contact</span>
                </div>
                <div class="links-wrapper">
                    <a href="https://www.facebook.com/NPXS0123zz/" target="_blank" class="link-card">
                        <i class="fab fa-facebook"></i> Facebook
                    </a>
                    <a href="https://www.instagram.com/ntp_rmx/" target="_blank" class="link-card">
                        <i class="fab fa-instagram"></i> Instagram
                    </a>
                </div>
            </div>

            <div class="category-divider"></div>

            <!-- ผลงาน (Works) Section -->
            <div class="category-section">
                <div class="category-label">
                    <i class="fas fa-briefcase"></i>
                    <span>ผลงาน · Works</span>
                </div>
                <div class="links-wrapper">
                    <a href="https://www.youtube.com/@NATTAPHONREMIX" target="_blank" class="link-card">
                        <i class="fab fa-youtube"></i> YouTube Channel
                    </a>
                    <a href="https://ntpremix.x2finity.xyz/" target="_blank" class="link-card">
                        <i class="fas fa-camera"></i> PHOTO
                    </a>
                </div>
            </div>

            <!-- Social Icons Footer -->
            <div class="socials-wrapper">
                <a href="https://www.facebook.com/NPXS0123zz/" target="_blank" class="social-link facebook">
                    <i class="fab fa-facebook"></i>
                </a>
                <a href="https://www.instagram.com/ntp_rmx/" target="_blank" class="social-link instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://www.youtube.com/@NATTAPHONREMIX" target="_blank" class="social-link youtube">
                    <i class="fab fa-youtube"></i>
                </a>
            </div>
        </div>

        <footer class="footer">
            &copy; 2026 NPXS Collection.
        </footer>
    </div>
</body>

</html>
